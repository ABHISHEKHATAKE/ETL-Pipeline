# Warehouse Postgres + Airflow (LocalExecutor). Start with:  make up
x-airflow-common: &airflow-common
  build: .
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    PYTHONPATH: /opt/airflow
    DATABASE_URL: postgresql+psycopg2://${WAREHOUSE_USER:-warehouse}:${WAREHOUSE_PASSWORD:-warehouse}@warehouse-db:5432/${WAREHOUSE_DB:-retail_dw}
    TEST_DATABASE_URL: postgresql+psycopg2://${WAREHOUSE_USER:-warehouse}:${WAREHOUSE_PASSWORD:-warehouse}@warehouse-db:5432/retail_dw_test
    MAX_REJECT_RATE: ${MAX_REJECT_RATE:-0.20}
    RAW_DIR: /opt/airflow/data/raw
    STAGING_DIR: /opt/airflow/data/staging
  volumes:
    - ./dags:/opt/airflow/dags
    - ./etl:/opt/airflow/etl
    - ./sql:/opt/airflow/sql
    - ./tests:/opt/airflow/tests
    - ./data:/opt/airflow/data
    - ./airflow-logs:/opt/airflow/logs
  depends_on:
    airflow-db: {condition: service_healthy}
    warehouse-db: {condition: service_healthy}

services:
  warehouse-db:                      # the data warehouse the pipeline loads into
    image: postgres:16
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER:-warehouse}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-warehouse}
      POSTGRES_DB: ${WAREHOUSE_DB:-retail_dw}
    ports: ["5433:5432"]             # 5433 on the host so it never clashes with a local Postgres
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER:-warehouse} -d ${WAREHOUSE_DB:-retail_dw}"]
      interval: 5s
      retries: 10

  airflow-db:                        # Airflow's own metadata database
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes: [airflow-meta:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db migrate &&
               airflow users create --username admin --password admin
               --firstname Admin --lastname User --role Admin --email admin@example.com || true"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: ["8080:8080"]
    depends_on:
      airflow-init: {condition: service_completed_successfully}

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init: {condition: service_completed_successfully}

volumes:
  warehouse-data:
  airflow-meta:
